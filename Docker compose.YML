services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # No ports exposed to the host on purpose — only the bot service needs to reach it,
    # over the internal compose network as "mongo:27017". Uncomment below if you want
    # host access (e.g. Compass) too.
    # ports:
    #   - "27017:27017"

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      # Overrides whatever DB_URL is in .env so the bot always talks to the mongo
      # service above by its compose network name, not localhost.
      DB_URL: mongodb://mongo:27017
    volumes:
      # Keeps the Pyrogram .session file (so it doesn't re-login every restart) and any
      # in-progress downloads/torrents/temp files across container restarts.
      - bot_data:/app
      # If you'd rather edit .env/bot.py without rebuilding the image during development,
      # bind-mount the source instead of relying solely on the image's COPY:
      # - ./:/app

volumes:
  mongo_data:
  bot_data:
